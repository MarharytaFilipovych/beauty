apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8088
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: cafetiria-config
                  key: ORDER_DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cafetiria-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cafetiria-secret
                  key: DB_PASSWORD
            - name: USERS_URL
              valueFrom:
                configMapKeyRef:
                  name: cafetiria-config
                  key: USER_SERVICE_URL
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: cafetiria-config
                  key: RABBITMQ_HOST
            - name: RABBIT_PORT
              valueFrom:
                configMapKeyRef:
                  name: cafetiria-config
                  key: RABBIT_PORT
          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8088
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8088
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 8088
      targetPort: 8088