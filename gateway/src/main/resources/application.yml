spring:
  application.name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: order-service
              uri: ${ORDER_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/orders,/orders/**
              filters:
                - RewritePath=/orders(?:/(?<segment>.+))?, /api/orders/$\{segment}

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8080}
              predicates:
                - Path=/users,/users/**
              filters:
                - RewritePath=/users(?:/(?<segment>.+))?, /api/users/$\{segment}

server:
  port: 8081

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: DEBUG