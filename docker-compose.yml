services:
  postgres:
    container_name: postgres
    image: postgres:16
    platform: linux/arm64
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cafetiria
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cafetiria-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d cafetiria" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cafetiria:
    container_name: cafetiria
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:postgresql://postgres:5432/cafetiria
    ports:
      - "8088:8088"
    networks:
      - cafetiria-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  cafetiria-network:
    driver: bridge

volumes:
  - postgres-data: